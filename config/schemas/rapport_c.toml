# ===========================================================================
# SCHEMA DU RAPPORT C  --  ~70 000 lignes / semaine
# Meme principe que rapport_a, avec une maille plus fine.
# ===========================================================================

nom = "rapport_c"
libelle = "Detail operations - perimetre C"

# Pour un .xlsx, seuls "motif" et "format" comptent : separateur, encodage et
# decimal ne s'appliquent qu'au CSV, et les cellules de type date d'Excel sont
# reprises telles quelles sans passer par "format_date".
[fichier]
motif = "*rapport_c*"
format = "csv"
separateur = ";"
encodage = "cp1252"
decimal = ","
format_date = "%d/%m/%Y"

[cle]
colonnes = ["id_ligne"]
colonne_date = "date_operation"
colonnes_comparees = ["statut", "montant", "quantite", "delai_jours", "sous_categorie"]

[[colonnes]]
source = "N Ligne"
cible = "id_ligne"
type = "string"
obligatoire = true

[[colonnes]]
source = "Date operation"
cible = "date_operation"
type = "date"
obligatoire = true

[[colonnes]]
source = "Entite"
cible = "entite"
type = "string"
obligatoire = true

[[colonnes]]
source = "Categorie"
cible = "categorie"
type = "string"
obligatoire = true

[[colonnes]]
source = "Sous categorie"
cible = "sous_categorie"
type = "string"
obligatoire = false

[[colonnes]]
source = "Statut"
cible = "statut"
type = "string"
obligatoire = true

[[colonnes]]
source = "Montant"
cible = "montant"
type = "float"
obligatoire = true

[[colonnes]]
source = "Quantite"
cible = "quantite"
type = "int"
obligatoire = false

[[colonnes]]
source = "Delai (j)"
cible = "delai_jours"
type = "int"
obligatoire = false

[filtre]
expression = "statut != 'Annule'"

[controles]
lignes_min = 20000
lignes_max = 150000
variation_lignes_max_pct = 30.0
variation_total_max_pct = 25.0
mesure_totale = "montant"
colonnes_non_nulles = ["id_ligne", "date_operation", "entite", "montant"]
unicite = ["id_ligne"]

[controles.valeurs_autorisees]
statut = ["Ouvert", "En cours", "Clos"]
