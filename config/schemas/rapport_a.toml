# ===========================================================================
# SCHEMA DU RAPPORT A  --  ~20 000 lignes / semaine
#
# A ADAPTER : les noms de colonnes "source" doivent correspondre EXACTEMENT
# aux en-tetes du fichier tel que le portail le produit. Le pipeline refuse
# d'ingerer un fichier dont le schema ne correspond pas : c'est voulu, c'est
# ce qui detecte qu'une requete du portail a change sans prevenir.
# ===========================================================================

nom = "rapport_a"
libelle = "Activite hebdomadaire - perimetre A"

# Pour un .xlsx, seuls "motif" et "format" comptent : separateur, encodage et
# decimal ne s'appliquent qu'au CSV, et les cellules de type date d'Excel sont
# reprises telles quelles sans passer par "format_date".
[fichier]
motif = "*rapport_a*"          # motif de reconnaissance du fichier telecharge
format = "csv"                 # csv | xlsx
separateur = ";"
encodage = "cp1252"            # export Windows classique ; utiliser "utf-8-sig" si besoin
decimal = ","
format_date = "%d/%m/%Y"

[cle]
# Clef metier : identifie une ligne de facon stable d'une extraction a l'autre.
# C'est elle qui permet de detecter les corrections retroactives.
colonnes = ["id_ligne"]
# Colonne de date metier (differente de la date d'extraction).
colonne_date = "date_operation"
# Colonnes dont la modification constitue un changement a signaler.
colonnes_comparees = ["statut", "montant", "quantite", "categorie"]

[[colonnes]]
source = "N Ligne"
cible = "id_ligne"
type = "string"
obligatoire = true

[[colonnes]]
source = "Date operation"
cible = "date_operation"
type = "date"
obligatoire = true

[[colonnes]]
source = "Entite"
cible = "entite"
type = "string"
obligatoire = true

[[colonnes]]
source = "Categorie"
cible = "categorie"
type = "string"
obligatoire = true

[[colonnes]]
source = "Statut"
cible = "statut"
type = "string"
obligatoire = true

[[colonnes]]
source = "Montant"
cible = "montant"
type = "float"
obligatoire = true

[[colonnes]]
source = "Quantite"
cible = "quantite"
type = "int"
obligatoire = false

# --- Filtrage applique a l'ingestion -------------------------------------
# C'EST ICI que se formalise le "je filtre pour garder ce dont j'ai besoin".
# Laisser vide pour tout conserver et filtrer plus tard dans le mart SQL.
[filtre]
# Expression pandas.query() ; vide = aucun filtre.
expression = "statut != 'Annule'"

# --- Controles qualite bloquants -----------------------------------------
[controles]
lignes_min = 5000
lignes_max = 60000
variation_lignes_max_pct = 30.0
variation_total_max_pct = 25.0
mesure_totale = "montant"
colonnes_non_nulles = ["id_ligne", "date_operation", "entite", "montant"]
unicite = ["id_ligne"]

[controles.valeurs_autorisees]
statut = ["Ouvert", "En cours", "Clos"]
